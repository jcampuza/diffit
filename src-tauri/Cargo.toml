[package]
name = "diffit"
version = "0.1.0"
description = "A small local Git diff viewer"
authors = ["Diffit"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "diffit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "diffit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
